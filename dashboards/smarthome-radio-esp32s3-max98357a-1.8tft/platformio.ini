[platformio]
default_envs = esp32s3-n16r8
src_dir = .

[env:esp32s3-n16r8]
; This release contains Arduino-ESP32 3.0.7 and ESP-IDF 5.1.4.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/51.03.07/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
monitor_speed = 115200
upload_speed = 460800
build_src_filter = +<*.ino> +<*.ino.cpp> +<AudioCallbacks.cpp>
extra_scripts = pre:scripts/patch_audioi2s.py
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    https://github.com/schreibfaul1/ESP32-audioI2S.git#928c420d49fce2a09fa91f490b9fcabed6447c67
    bblanchon/ArduinoJson@6.21.6
    adafruit/Adafruit GFX Library@1.12.6
    adafruit/Adafruit ST7735 and ST7789 Library@1.11.0
    adafruit/Adafruit BusIO@1.17.4
    adafruit/Adafruit seesaw Library@1.7.9
    ; Use ESP32's SD rather than the incompatible generic Arduino SD dependency.
    SD=symlink://${platformio.packages_dir}/framework-arduinoespressif32/libraries/SD
